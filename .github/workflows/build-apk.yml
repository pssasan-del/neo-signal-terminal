name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Dart Syntax Gate
        run: dart format --output=none lib/main.dart lib/king_bro_theme.dart

      - name: Analyze Compatibility
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=APP_API_TOKEN=${{ secrets.APP_API_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-signal-terminal-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
