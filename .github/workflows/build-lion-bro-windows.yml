name: Build LION BRO Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-lion-bro-windows.yml'
jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) { flutter create --platforms=windows . }
          Copy-Item windows_assets/app_icon.ico windows/runner/resources/app_icon.ico -Force
          $p='windows/runner/main.cpp'
          (Get-Content $p -Raw).Replace('L"lion_bro"','L"LION BRO"') | Set-Content $p -Encoding UTF8
      - name: Dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package LION BRO
        shell: pwsh
        run: |
          $r='build/windows/x64/runner/Release'
          if (-not (Test-Path $r)) { $r='build/windows/runner/Release' }
          $exe=Get-ChildItem $r -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'EXE missing after build' }
          Rename-Item $exe.FullName 'LION BRO.exe' -Force
          Compress-Archive -Path "$r/*" -DestinationPath 'LION_BRO_WINDOWS_RELEASE.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LION-BRO-Windows-EXE
          path: mobile/LION_BRO_WINDOWS_RELEASE.zip
          if-no-files-found: error
